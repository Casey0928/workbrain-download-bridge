name: WorkBrain Download Worker

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    paths:
      - ".github/workbrain-trigger.txt"

permissions:
  contents: read
  id-token: write

concurrency:
  group: workbrain-download-worker
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      WORKER_URL: "https://mttaigtrzlwpgjnpegmt.supabase.co/functions/v1/github-download-worker"
      OIDC_AUDIENCE: "workbrain-download-bridge"

    steps:
      - name: Get GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -Eeuo pipefail
          RESPONSE="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")"
          TOKEN="$(printf '%s' "$RESPONSE" | jq -r '.value')"
          test -n "$TOKEN" && test "$TOKEN" != "null"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Claim oldest WorkBrain job
        id: claim
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -Eeuo pipefail
          RESPONSE="$(curl --fail --silent --show-error \
            -X POST "$WORKER_URL" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"op\":\"claim\",\"run_id\":${GITHUB_RUN_ID}}")"
          printf '%s\n' "$RESPONSE" | jq .
          JOB_ID="$(printf '%s' "$RESPONSE" | jq -r '.job.id // empty')"
          if [ -z "$JOB_ID" ]; then
            echo "has_job=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$RESPONSE" | jq -r '.job.source_url' > "$RUNNER_TEMP/source_url"
          printf '%s' "$RESPONSE" | jq -r '.job.filename' > "$RUNNER_TEMP/filename"
          printf '%s' "$RESPONSE" | jq -r '.job.drive_path' > "$RUNNER_TEMP/drive_path"
          printf '%s' "$RESPONSE" | jq -c '.job.metadata // {}' > "$RUNNER_TEMP/metadata.json"
          echo "has_job=true" >> "$GITHUB_OUTPUT"
          echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"

      - name: Validate job URL
        if: steps.claim.outputs.has_job == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          export SOURCE_URL="$(cat "$RUNNER_TEMP/source_url")"
          export DEST_FILENAME="$(cat "$RUNNER_TEMP/filename")"
          export DRIVE_PATH="$(cat "$RUNNER_TEMP/drive_path")"
          python3 - <<'PY'
          import ipaddress, os, socket
          from urllib.parse import urlsplit
          url = os.environ["SOURCE_URL"].strip()
          filename = os.environ["DEST_FILENAME"].strip()
          drive_path = os.environ["DRIVE_PATH"].strip()
          p = urlsplit(url)
          if p.scheme != "https" or not p.hostname:
              raise SystemExit("Only valid https:// URLs are allowed")
          if p.username or p.password:
              raise SystemExit("Credentials embedded in URL are not allowed")
          if not filename or filename in {".", ".."} or "/" in filename or "\\" in filename:
              raise SystemExit("Invalid destination filename")
          if not drive_path or ".." in drive_path.split("/"):
              raise SystemExit("Invalid Drive path")
          if p.hostname.lower() in {"localhost", "localhost.localdomain"}:
              raise SystemExit("Localhost is not allowed")
          infos = socket.getaddrinfo(p.hostname, p.port or 443, type=socket.SOCK_STREAM)
          for info in infos:
              ip = ipaddress.ip_address(info[4][0])
              if ip.is_private or ip.is_loopback or ip.is_link_local or ip.is_multicast or ip.is_reserved or ip.is_unspecified:
                  raise SystemExit(f"Refusing non-public destination IP: {ip}")
          print("URL validation OK")
          PY

      - name: Mark downloading
        if: steps.claim.outputs.has_job == 'true'
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          JOB_ID: ${{ steps.claim.outputs.job_id }}
        run: |
          curl --fail --silent --show-error \
            -X POST "$WORKER_URL" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"op\":\"update\",\"job_id\":\"$JOB_ID\",\"status\":\"downloading\"}" | jq .

      - name: Download online file and hash
        if: steps.claim.outputs.has_job == 'true'
        id: download
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          SOURCE_URL="$(cat "$RUNNER_TEMP/source_url")"
          OUT="$RUNNER_TEMP/workbrain-download.bin"
          curl \
            --proto '=https' \
            --tlsv1.2 \
            --fail \
            --location \
            --retry 4 \
            --retry-all-errors \
            --connect-timeout 30 \
            --speed-time 60 \
            --speed-limit 1024 \
            --silent \
            --show-error \
            --output "$OUT" \
            "$SOURCE_URL"
          SIZE="$(stat -c%s "$OUT")"
          SHA256="$(sha256sum "$OUT" | awk '{print $1}')"
          MIME_TYPE="$(file --brief --mime-type "$OUT" || echo application/octet-stream)"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "mime_type=$MIME_TYPE" >> "$GITHUB_OUTPUT"
          echo "Downloaded $SIZE bytes; sha256=$SHA256; mime=$MIME_TYPE"

      - name: Request one-time Drive upload session
        if: steps.claim.outputs.has_job == 'true' && steps.download.outcome == 'success'
        id: session
        continue-on-error: true
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          JOB_ID: ${{ steps.claim.outputs.job_id }}
          MIME_TYPE: ${{ steps.download.outputs.mime_type }}
        run: |
          set -Eeuo pipefail
          RESPONSE="$(jq -nc --arg job_id "$JOB_ID" --arg mime_type "$MIME_TYPE" '{op:"upload_session",job_id:$job_id,mime_type:$mime_type}' \
            | curl --fail --silent --show-error \
                -X POST "$WORKER_URL" \
                -H "Authorization: Bearer $OIDC_TOKEN" \
                -H "Content-Type: application/json" \
                --data-binary @-)"
          printf '%s\n' "$RESPONSE" | jq .
          UPLOAD_URL="$(printf '%s' "$RESPONSE" | jq -r '.upload_url // empty')"
          test -n "$UPLOAD_URL"
          printf '%s' "$UPLOAD_URL" > "$RUNNER_TEMP/drive_upload_url"

      - name: Upload file directly to Google Drive
        if: steps.claim.outputs.has_job == 'true' && steps.download.outcome == 'success' && steps.session.outcome == 'success'
        id: upload
        continue-on-error: true
        shell: bash
        env:
          MIME_TYPE: ${{ steps.download.outputs.mime_type }}
        run: |
          set -Eeuo pipefail
          OUT="$RUNNER_TEMP/workbrain-download.bin"
          UPLOAD_URL="$(cat "$RUNNER_TEMP/drive_upload_url")"
          RESPONSE_FILE="$RUNNER_TEMP/drive_response.json"
          curl --fail --silent --show-error \
            -X PUT "$UPLOAD_URL" \
            -H "Content-Type: $MIME_TYPE" \
            --upload-file "$OUT" \
            -o "$RESPONSE_FILE"
          cat "$RESPONSE_FILE" | jq .
          DRIVE_FILE_ID="$(jq -r '.id // empty' "$RESPONSE_FILE")"
          DRIVE_URL="$(jq -r '.webViewLink // empty' "$RESPONSE_FILE")"
          test -n "$DRIVE_FILE_ID"
          echo "drive_file_id=$DRIVE_FILE_ID" >> "$GITHUB_OUTPUT"
          echo "drive_url=$DRIVE_URL" >> "$GITHUB_OUTPUT"

      - name: Report completed upload
        if: steps.claim.outputs.has_job == 'true' && steps.upload.outcome == 'success'
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          JOB_ID: ${{ steps.claim.outputs.job_id }}
          SIZE: ${{ steps.download.outputs.size }}
          SHA256: ${{ steps.download.outputs.sha256 }}
          DRIVE_FILE_ID: ${{ steps.upload.outputs.drive_file_id }}
          DRIVE_URL: ${{ steps.upload.outputs.drive_url }}
        run: |
          jq -nc \
            --arg job_id "$JOB_ID" \
            --arg sha256 "$SHA256" \
            --arg drive_file_id "$DRIVE_FILE_ID" \
            --arg drive_url "$DRIVE_URL" \
            --argjson size "$SIZE" \
            '{op:"update",job_id:$job_id,status:"completed",size_bytes:$size,bytes_downloaded:$size,sha256:$sha256,drive_file_id:$drive_file_id,drive_url:$drive_url,metadata:{bridge_phase:"github_to_drive_verified",online_download_verified:true,drive_upload_verified:true,runner:"ubuntu-latest"}}' \
          | curl --fail --silent --show-error \
              -X POST "$WORKER_URL" \
              -H "Authorization: Bearer $OIDC_TOKEN" \
              -H "Content-Type: application/json" \
              --data-binary @- | jq .

      - name: Report failure
        if: steps.claim.outputs.has_job == 'true' && (steps.download.outcome == 'failure' || steps.session.outcome == 'failure' || steps.upload.outcome == 'failure')
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          JOB_ID: ${{ steps.claim.outputs.job_id }}
        run: |
          if [ "${{ steps.download.outcome }}" = "failure" ]; then MSG="GitHub runner could not download the source URL";
          elif [ "${{ steps.session.outcome }}" = "failure" ]; then MSG="Supabase could not create a Google Drive upload session";
          else MSG="Google Drive upload failed"; fi
          jq -nc --arg job_id "$JOB_ID" --arg msg "$MSG" '{op:"update",job_id:$job_id,status:"failed",error_detail:$msg,metadata:{bridge_phase:"github_to_drive"}}' \
          | curl --silent --show-error \
              -X POST "$WORKER_URL" \
              -H "Authorization: Bearer $OIDC_TOKEN" \
              -H "Content-Type: application/json" \
              --data-binary @- | jq .
          exit 1

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## WorkBrain worker"
            echo
            echo "- Repository: $GITHUB_REPOSITORY"
            echo "- Trigger: $GITHUB_EVENT_NAME"
            echo "- GitHub -> Supabase auth: OIDC (no PAT)"
            echo "- Google Drive credential on GitHub: none"
            echo "- GitHub Artifact/cache: not used"
            echo "- Drive upload: Supabase-issued one-time resumable session"
          } >> "$GITHUB_STEP_SUMMARY"
